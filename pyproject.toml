[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness-audit"
version = "0.0.1"
description = "Audit tool-calling agent harnesses for privilege-boundary problems"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "c01n31pan1c", email = "panic@c01n31.net"}]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
[project.scripts]
ahaudit = "ahaudit.cli:main"

[tool.setuptools.packages.find]
include = ["ahaudit*"]

[tool.setuptools.package-data]
ahaudit = ["schema/*.json"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
